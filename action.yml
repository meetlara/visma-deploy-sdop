name: Report the deployment to Visma Hubble
description: "Registers the deployment in Hubble for the Engineering Performance (ENGP/SDOP) metrics"
inputs:
  hubble_client_id:
    description: Visma Connect client id with the VismaHubbleTrackingApi:deploymentsWrite scope
    required: true
  hubble_client_secret:
    description: Visma Connect client secret
    required: true
  application_external_id:
    description: Hubble product id of the application (it replaces the Jira component)
    required: false
    default: "1988"
  deployment_status:
    description: Outcome of the deploy step (steps.deployment.outcome). success is reported as Released, failure as Failed, anything else is not reported
    required: false
    default: "success"
  deployment_start:
    description: When the deploy step started (ISO 8601). Defaults to the start of this run attempt
    required: false
  extra_labels:
    description: Extra labels to add to the deployment
    required: false
  test:
    description: Is this execution a test/dry-run
    required: false
    default: "false"
outputs:
  deployment_key:
    description: The Hubble deployment key, e.g. DPL_42
    value: ${{ steps.report.outputs.deployment_key }}
  deployment_url:
    description: Link to the deployment in Hubble
    value: ${{ steps.report.outputs.deployment_url }}
runs:
  using: "composite"
  steps:
    - name: Report the deployment to Visma Hubble
      id: report
      shell: bash
      env:
        HUBBLE_CLIENT_ID: ${{ inputs.hubble_client_id }}
        HUBBLE_CLIENT_SECRET: ${{ inputs.hubble_client_secret }}
        APPLICATION_EXTERNAL_ID: ${{ inputs.application_external_id }}
        DEPLOYMENT_STATUS: ${{ inputs.deployment_status }}
        DEPLOYMENT_START: ${{ inputs.deployment_start }}
        TEST: ${{ inputs.test }}
        EXTRA_LABELS: ${{ inputs.extra_labels }}
        SUMMARY: ${{ github.event.pull_request.title }}
        DESCRIPTION: ${{ github.event.pull_request.body }}
        PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
        GH_REPOSITORY: ${{ github.event.repository.name }}
        GH_TOKEN: ${{ github.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        CONNECT_TOKEN_URL="https://connect.visma.com/connect/token"
        HUBBLE_DEPLOYMENTS_URL="https://k8s.hubble.visma.com/tracking-system/api/deployments"
        HUBBLE_DEPLOYMENT_PAGE_URL="https://hubble.visma.com/management/engineering-performance/deployments"
        HUBBLE_STATUS_RELEASED=2
        HUBBLE_STATUS_FAILED=3

        case "$DEPLOYMENT_STATUS" in
          success) STATUS=$HUBBLE_STATUS_RELEASED ;;
          failure) STATUS=$HUBBLE_STATUS_FAILED ;;
          *)
            # The deploy step never ran (an earlier step failed) or was cancelled:
            # there is no deployment to report
            echo "::notice::Deploy step outcome is '${DEPLOYMENT_STATUS:-empty}', nothing to report"
            exit 0
            ;;
        esac

        # AWS keeps rolling out the Blue/Green deployment after the workflow is
        # already done, so those minutes are never part of any run we can measure
        MINUTES_OF_BLUE_GREEN_ROLLOUT=2

        WHEN_WAS_DEPLOYED=$(date -Iseconds)
        RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"

        if [ "$EVENT_NAME" != "pull_request" ]; then
          # Called from the deploy workflow itself, so this run is the deployment.
          # There is no pull_request payload here: the PR comes from the commit
          PULL_REQUEST=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // empty' || true)

          if [ -n "$PULL_REQUEST" ]; then
            SUMMARY=$(jq -r '.title' <<< "$PULL_REQUEST")
            DESCRIPTION=$(jq -r '.body // ""' <<< "$PULL_REQUEST")
            PR_URL=$(jq -r '.html_url' <<< "$PULL_REQUEST")
            PR_AUTHOR=$(jq -r '.user.login' <<< "$PULL_REQUEST")
            PR_MERGED_AT=$(jq -r '.merged_at // empty' <<< "$PULL_REQUEST")
          else
            echo "::warning::No pull request found for $GITHUB_SHA, using the commit instead"
            COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" || echo "{}")
            COMMIT_MESSAGE=$(jq -r '.commit.message // ""' <<< "$COMMIT")
            SUMMARY=$(head -1 <<< "$COMMIT_MESSAGE")
            DESCRIPTION="$COMMIT_MESSAGE"
            PR_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            PR_AUTHOR="$GITHUB_ACTOR"
            PR_MERGED_AT=$(jq -r '.commit.committer.date // empty' <<< "$COMMIT")
          fi
        fi

        if [ -z "$DEPLOYMENT_START" ]; then
          # run_started_at is the start of the current attempt, so a re-run measures itself
          DEPLOYMENT_START=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' || true)
        fi
        if [ -z "$DEPLOYMENT_START" ] || [ "$DEPLOYMENT_START" = "null" ]; then
          echo "::warning::Could not read when the deployment started, using the merge time"
          DEPLOYMENT_START="${PR_MERGED_AT:-now}"
        fi
        if [ -z "$PR_MERGED_AT" ]; then
          echo "::warning::Could not read the merge time, using when the deployment started"
          PR_MERGED_AT="$DEPLOYMENT_START"
        fi

        minutes_since() {
          echo $(( ($(date +%s) - $(date -d "$1" +%s)) / 60 + MINUTES_OF_BLUE_GREEN_ROLLOUT ))
        }

        if [ "$STATUS" = "$HUBBLE_STATUS_RELEASED" ]; then
          MINUTES_OF_DEPLOYMENT=$(minutes_since "$DEPLOYMENT_START")
          # The lead time runs from the merge, so a deploy re-run after a failure
          # carries the time the change waited
          MINUTES_OF_LEAD_TIME=$(minutes_since "$PR_MERGED_AT")
          NUMBER_OF_CHANGES=1
        else
          # A failed deployment delivers nothing: its change is counted by the run that releases it
          MINUTES_OF_DEPLOYMENT=0
          MINUTES_OF_LEAD_TIME=0
          NUMBER_OF_CHANGES=0
        fi

        # Hubble refuses to release a deployment without a description
        DESCRIPTION=$(printf '%s\n\n%s' "$PR_URL" "$DESCRIPTION")

        LABELS=("sub-repo-$GH_REPOSITORY" "sub-author-$PR_AUTHOR")
        if [ -n "$EXTRA_LABELS" ]; then
          IFS=',' read -ra EXTRA <<< "$EXTRA_LABELS"
          LABELS+=("${EXTRA[@]}")
        fi

        ACCESS_TOKEN=$(curl --silent --show-error --fail-with-body "$CONNECT_TOKEN_URL" \
          --data-urlencode "grant_type=client_credentials" \
          --data-urlencode "client_id=$HUBBLE_CLIENT_ID" \
          --data-urlencode "client_secret=$HUBBLE_CLIENT_SECRET" \
          --data-urlencode "scope=VismaHubbleTrackingApi:deploymentsWrite" \
          | jq -r '.access_token')
        echo "::add-mask::$ACCESS_TOKEN"

        # An explicit false would override an exclusion label, so only true is sent
        PAYLOAD=$(jq -n \
          --arg summary "$SUMMARY" \
          --arg description "$DESCRIPTION" \
          --argjson applicationExternalId "$APPLICATION_EXTERNAL_ID" \
          --arg deploymentDateTime "$WHEN_WAS_DEPLOYED" \
          --argjson deploymentDurationMinutes "$MINUTES_OF_DEPLOYMENT" \
          --argjson totalLeadTimeMinutes "$MINUTES_OF_LEAD_TIME" \
          --argjson numberOfChanges "$NUMBER_OF_CHANGES" \
          --arg buildInfoUrl "$RUN_URL" \
          --arg test "$TEST" \
          '{
            summary: $summary,
            description: $description,
            applicationExternalId: $applicationExternalId,
            deploymentDateTime: $deploymentDateTime,
            deploymentDurationMinutes: $deploymentDurationMinutes,
            totalLeadTimeMinutes: $totalLeadTimeMinutes,
            numberOfChanges: $numberOfChanges,
            buildInfoUrl: $buildInfoUrl,
            labels: ($ARGS.positional | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != "")))
          } + (if $test == "true" then {isExcludedFromMetrics: true} else {} end)' --args "${LABELS[@]}")

        echo "Request: $PAYLOAD"

        DEPLOYMENT=$(curl --silent --show-error --fail-with-body "$HUBBLE_DEPLOYMENTS_URL" \
          --header "Authorization: Bearer $ACCESS_TOKEN" \
          --header "Content-Type: application/json" \
          --data "$PAYLOAD")

        echo "Response: $DEPLOYMENT"
        DEPLOYMENT_KEY=$(jq -r '.externalId' <<< "$DEPLOYMENT")
        DEPLOYMENT_URL="$HUBBLE_DEPLOYMENT_PAGE_URL/$(jq -r '.token' <<< "$DEPLOYMENT")"

        # A create carries no status: every deployment starts as Started
        TRANSITIONED=$(curl --silent --show-error --fail-with-body --request PATCH \
          "$HUBBLE_DEPLOYMENTS_URL/$DEPLOYMENT_KEY/status" \
          --header "Authorization: Bearer $ACCESS_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"status\": $STATUS}")

        echo "Transition response: $TRANSITIONED"
        echo "::notice title=Deployment $DEPLOYMENT_KEY in Hubble::$DEPLOYMENT_URL"
        {
          echo "deployment_key=$DEPLOYMENT_KEY"
          echo "deployment_url=$DEPLOYMENT_URL"
        } >> "$GITHUB_OUTPUT"
