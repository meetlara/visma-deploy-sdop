name: Report the deployment to Visma Hubble
description: "Registers the deployment in Hubble for the Engineering Performance (ENGP/SDOP) metrics"
inputs:
  hubble_client_id:
    description: Visma Connect client id with the VismaHubbleTrackingApi:deploymentsWrite scope
    required: true
  hubble_client_secret:
    description: Visma Connect client secret
    required: true
  components:
    description: ENGP components (comma separated) that resolve to the Hubble application
    required: false
    default: "1988-Lara AI"
  extra_labels:
    description: Extra labels to add to the deployment
    required: false
  test:
    description: Is this execution a test/dry-run
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Report the deployment to Visma Hubble
      shell: bash
      env:
        HUBBLE_CLIENT_ID: ${{ inputs.hubble_client_id }}
        HUBBLE_CLIENT_SECRET: ${{ inputs.hubble_client_secret }}
        COMPONENTS: ${{ inputs.components }}
        TEST: ${{ inputs.test }}
        EXTRA_LABELS: ${{ inputs.extra_labels }}
        SUMMARY: ${{ github.event.pull_request.title }}
        DESCRIPTION: ${{ github.event.pull_request.body }}
        PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
        GH_REPOSITORY: ${{ github.event.repository.name }}
        GH_TOKEN: ${{ github.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        CONNECT_TOKEN_URL="https://connect.visma.com/connect/token"
        HUBBLE_DEPLOYMENTS_URL="https://k8s.hubble.visma.com/tracking-system/api/deployments"
        HUBBLE_STATUS_RELEASED=2

        # AWS keeps rolling out the Blue/Green deployment after the workflow is
        # already done, so those minutes are never part of any run we can measure
        MINUTES_OF_BLUE_GREEN_ROLLOUT=2

        WHEN_WAS_DEPLOYED=$(date -Iseconds)
        RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        RUN_STARTED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' || true)

        if [ "$EVENT_NAME" != "pull_request" ]; then
          # Called from the deploy workflow itself, so this run is the deployment.
          # There is no pull_request payload here: the PR comes from the commit
          PULL_REQUEST=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // empty' || true)

          if [ -n "$PULL_REQUEST" ]; then
            SUMMARY=$(jq -r '.title' <<< "$PULL_REQUEST")
            DESCRIPTION=$(jq -r '.body // ""' <<< "$PULL_REQUEST")
            PR_URL=$(jq -r '.html_url' <<< "$PULL_REQUEST")
            PR_AUTHOR=$(jq -r '.user.login' <<< "$PULL_REQUEST")
          else
            echo "::warning::No pull request found for $GITHUB_SHA, using the commit instead"
            COMMIT_MESSAGE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message' || true)
            SUMMARY=$(head -1 <<< "$COMMIT_MESSAGE")
            DESCRIPTION="$COMMIT_MESSAGE"
            PR_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            PR_AUTHOR="$GITHUB_ACTOR"
          fi
        fi

        if [ -z "$RUN_STARTED_AT" ] || [ "$RUN_STARTED_AT" = "null" ]; then
          echo "::warning::Could not read run_started_at, falling back to the merge time"
          RUN_STARTED_AT="${PR_MERGED_AT:-now}"
        fi

        MINUTES_OF_PR_DEPLOYMENT=$(( ($(date +%s) - $(date -d "$RUN_STARTED_AT" +%s)) / 60 + MINUTES_OF_BLUE_GREEN_ROLLOUT ))

        # Hubble refuses to release a deployment without a description
        DESCRIPTION=$(printf '%s\n\n%s' "$PR_URL" "$DESCRIPTION")

        LABELS=("sub-repo-$GH_REPOSITORY" "sub-author-$PR_AUTHOR")
        if [ -n "$EXTRA_LABELS" ]; then
          IFS=',' read -ra EXTRA <<< "$EXTRA_LABELS"
          LABELS+=("${EXTRA[@]}")
        fi

        IS_EXCLUDED_FROM_METRICS=false
        if [ "$TEST" = "true" ]; then
          LABELS+=("SDOPexclude")
          IS_EXCLUDED_FROM_METRICS=true
        fi

        ACCESS_TOKEN=$(curl --silent --show-error --fail-with-body "$CONNECT_TOKEN_URL" \
          --data-urlencode "grant_type=client_credentials" \
          --data-urlencode "client_id=$HUBBLE_CLIENT_ID" \
          --data-urlencode "client_secret=$HUBBLE_CLIENT_SECRET" \
          --data-urlencode "scope=VismaHubbleTrackingApi:deploymentsWrite" \
          | jq -r '.access_token')
        echo "::add-mask::$ACCESS_TOKEN"

        PAYLOAD=$(jq -n \
          --arg summary "$SUMMARY" \
          --arg description "$DESCRIPTION" \
          --arg components "$COMPONENTS" \
          --arg deploymentDateTime "$WHEN_WAS_DEPLOYED" \
          --argjson minutes "$MINUTES_OF_PR_DEPLOYMENT" \
          --arg buildInfoUrl "$RUN_URL" \
          --argjson isExcludedFromMetrics "$IS_EXCLUDED_FROM_METRICS" \
          '{
            summary: $summary,
            description: $description,
            components: ($components | split(",") | map(gsub("^\\s+|\\s+$"; ""))),
            deploymentDateTime: $deploymentDateTime,
            deploymentDurationMinutes: $minutes,
            totalLeadTimeMinutes: $minutes,
            numberOfChanges: 1,
            buildInfoUrl: $buildInfoUrl,
            labels: ($ARGS.positional | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))),
            isExcludedFromMetrics: $isExcludedFromMetrics
          }' --args "${LABELS[@]}")

        echo "Request: $PAYLOAD"

        DEPLOYMENT=$(curl --silent --show-error --fail-with-body "$HUBBLE_DEPLOYMENTS_URL" \
          --header "Authorization: Bearer $ACCESS_TOKEN" \
          --header "Content-Type: application/json" \
          --data "$PAYLOAD")

        echo "Response: $DEPLOYMENT"
        DEPLOYMENT_KEY=$(jq -r '.externalId' <<< "$DEPLOYMENT")

        # A create carries no status: every deployment starts as Started
        RELEASED=$(curl --silent --show-error --fail-with-body --request PATCH \
          "$HUBBLE_DEPLOYMENTS_URL/$DEPLOYMENT_KEY/status" \
          --header "Authorization: Bearer $ACCESS_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"status\": $HUBBLE_STATUS_RELEASED}")

        echo "Release response: $RELEASED"
        echo "Deployment key: $DEPLOYMENT_KEY"
